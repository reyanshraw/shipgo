name: Bug report
description: Report a bug in shipgo
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for the report.
  - type: input
    id: version
    attributes: { label: shipgo version, placeholder: "1.0.0" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Windows, WSL, Git-Bash]
    validations: { required: true }
  - type: textarea
    id: description
    attributes: { label: Description }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }