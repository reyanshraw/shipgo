name: AI CI Repair
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ github.event.workflow_run.head_branch }} }
      - uses: OpenAgentHQ/repoheart@main
        with:
          config: |
            agents:
              ci_repair: true
              pr_review: false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}