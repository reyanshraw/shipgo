name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: ShellCheck
        if: runner.os != 'Windows'
        run: shellcheck -x shipgo.sh scripts/*.sh tests/*.sh
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Bash tests
        if: runner.os != 'Windows'
        run: bash tests/test-commands.sh
      - name: PowerShell tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./shipgo.ps1 version
